services:
  postgres-homeenergyregistry:
    image: postgres:16
    container_name: postgres-homeenergyregistry
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeenergyregistry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_homeenergyregistry_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16
    container_name: postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    restart: unless-stopped
    # Realm configuration as code, see keycloak/README.md; an existing realm is not overwritten.
    # Theme caching is off so changes in keycloak/themes are visible after a page reload (local only).
    command: start --import-realm --spi-theme--cache-themes=false --spi-theme--cache-templates=false --spi-theme--static-max-age=-1
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # Custom login pages (FreeMarker themes), select per realm: Realm settings -> Themes
      - ./keycloak/themes:/opt/keycloak/themes
      # Extensions (provider JARs, e.g. the 2FA email authenticator); picked up on container restart
      - ./keycloak/providers:/opt/keycloak/providers
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password

      #KC_HTTP_MANAGEMENT_PORT: 9090

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password

      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: true
    ports:
      - "9090:8080"
    depends_on:
      - postgres-keycloak
    networks:
      - keycloak-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: homeenergyregistry-prometheus
    ports:
      - "9091:9090" # host 9090 is taken by Keycloak
    depends_on:
      - alertmanager
    volumes:
      - ./src/main/resources/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./src/main/resources/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"


  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: homeenergyregistry-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./src/main/resources/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  kafka-homeenergyregistry:
    image: apache/kafka:4.0.2
    container_name: homeenergyregistry-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  minio-homeenergyregistry:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: homeenergyregistry-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API endpoint used by your Spring Boot app
      - "9001:9001" # MinIO web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped


  graylog-mongodb:
    image: mongo:7.0
    container_name: homeenergyregistry-graylog-mongodb
    volumes:
      - graylog-mongo-data:/data/db
    restart: unless-stopped

  graylog-opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: homeenergyregistry-graylog-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=true"
      - "plugins.security.ssl.http.enabled=false"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongPassword123!"
      - "network.host=0.0.0.0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - graylog-opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  graylog:
    image: graylog/graylog:7.1
    container_name: homeenergyregistry-graylog
    environment:
      - GRAYLOG_PASSWORD_SECRET=somepasswordpepper12345678901234
      - GRAYLOG_ROOT_PASSWORD_SHA2=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      - GRAYLOG_HTTP_EXTERNAL_URI=http://127.0.0.1:9009/
      - GRAYLOG_MONGODB_URI=mongodb://graylog-mongodb:27017/graylog
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://graylog-opensearch:9200
    entrypoint: /usr/bin/tini -- wait-for-it graylog-opensearch:9200 --  /docker-entrypoint.sh
    depends_on:
      - graylog-mongodb
      - graylog-opensearch
    ports:
      - "9009:9000"     # Web UI / API
      - "1514:1514/udp" # Syslog UDP (optional)
      - "12201:12201/udp" # GELF UDP (optional)
    restart: unless-stopped
    volumes:
      - graylog-data:/usr/share/graylog/data/data



volumes:
  postgres_homeenergyregistry_data:
  postgres_keycloak_data:
  prometheus-data:
  kafka-data:
  minio-data:
  graylog-mongo-data:
  graylog-opensearch-data:
  graylog-data:

networks:
  keycloak-network: