# 1. Schema (changes/): DDL only - tables, constraints, indexes. Immutable once applied.
# 2. Reference data (reference-data/): value sets the schema depends on, upserted from CSV.
# Start data (areas, admins, Keycloak accounts) is not part of the changelog, see org.example.bootstrap.
databaseChangeLog:
  - include:
      file: db/changelog/changes/000-user-action-log.sql
  - include:
      file: db/changelog/changes/001-create-building-zone-table.sql
  - include:
      file: db/changelog/changes/002-create-home-administrative-area-table.sql
  - include:
      file: db/changelog/changes/003-create-outside-public-area-table.sql
  - include:
      file: db/changelog/changes/004-create-app-user-table.sql
  - include:
      file: db/changelog/changes/005-create-user-role-table.sql
  - include:
      file: db/changelog/changes/006-create-revinfo-table.sql
  - include:
      file: db/changelog/changes/007-create-user-role-audit-table.sql
  - include:
      file: db/changelog/changes/008-create-esr-consumption-table.sql

  - include:
      file: db/changelog/reference-data/reference-data.yaml
