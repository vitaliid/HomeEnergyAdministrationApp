logging:
  level:
    root: INFO
    de.bund.bva.isyfact: INFO
    org.example: INFO
    org.hibernate.stat: DEBUG
    org.hibernate.cache: DEBUG
    org.hibernate.SQL: DEBUG


# it was required for IsyFact logging lib
isy:
  logging:
    anwendung:
      name: HomeEnergyRegistryApp
      typ: backend
      version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: homeenergyregistry-app
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  config:
    # Start data (areas, initial admins), see org.example.bootstrap.InitialDataBootstrap
    import: optional:classpath:bootstrap/initial-data.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/homeenergyregistry
    username: postgres
    password: password
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      # Modified flags would require a <column>_mod boolean per audited property in every *_aud
      # table; the migrations (007, 008) follow the plain Envers layout instead.
      org.hibernate.envers.global_with_modified_flag: false
      org.hibernate.envers.audit_table_suffix: _aud
      # A DEL revision keeps the deleted row's columns; otherwise only the id is recorded and the
      # audit could not say which role on which unit was revoked.
      org.hibernate.envers.store_data_at_delete: true
      hibernate:
        envers:
          autoRegisterListeners: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          javax:
            cache:
              provider: org.ehcache.jsr107.EhcacheCachingProvider
          cache:
            region:
              factory_class: jcache
        search:
          backend:
            type: lucene
            directory:
              type: local-filesystem
              root: ./build/hibernate-search-indexes
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/homeenergyregistry-realm
          jwk-set-uri: http://localhost:9090/realms/homeenergyregistry-realm/protocol/openid-connect/certs
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: homeenergyregistry-user-action-${HOSTNAME:local}-
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: homeenergyregistry-user-action-log-writer
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.example
        spring.json.value.default.type: org.example.domain.UserActionEvent
    listener:
      ack-mode: record

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    url: /ApiDefinition.yml

app:
  kafka:
    topics:
      user-actions: homeenergyregistry.user-actions.v1
  energy:
    threshold: 1000
  keycloak:
    # Admin API access for KeycloakUserService (client with service account + manage-users role)
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:9090}
    realm: ${KEYCLOAK_REALM:homeenergyregistry-realm}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:homeenergyregistry-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}
    initial-password: ${KEYCLOAK_INITIAL_PASSWORD:ChangeMe123!}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: homeenergyregistry-energy-uploads