# Language convention: everything in this specification — schema names, properties, enum values,
# path segments, summaries, descriptions, examples, operationIds, tags and comments — is English.

openapi: 3.0.3
info:
  title: ESR-GIR API
  description: >
    API for the Energy Supply Register (ESR) and the Gas Infrastructure Register (GIR).
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: HomeAdministrativeAreas
    description: Operations related to home administrative areas
  - name: YardPublicAreas
    description: Operations related to yard public areas
  - name: Users
    description: Operations related to user accounts
  - name: ESR
    description: Operations related to the Energy Supply Register (ESR)

paths:
  /home-administrative-areas:
    get:
      tags:
        - HomeAdministrativeAreas
      summary: List home administrative areas
      description: >
        Returns the home administrative areas within the caller's scope: the units on which the
        caller holds any role and all units subordinate to them. Every role is inherited
        downwards along the administrative hierarchy.
      operationId: listHomeAdministrativeAreas
      responses:
        "200":
          description: Successfully retrieved the list of home administrative areas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeAdministrativeArea'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /home-administrative-areas/{id}:
    get:
      tags:
        - HomeAdministrativeAreas
      summary: Get home administrative area by ID
      description: >
        Returns a single home administrative area by its unique identifier. The unit must lie within
        the caller's scope: a unit on which the caller holds any role, or one subordinate to such
        a unit. A unit outside the caller's scope is reported as not found.
      operationId: getHomeAdministrativeAreaById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        "200":
          description: Successfully retrieved the home administrative area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAdministrativeArea'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /yard-public-areas:
    get:
      tags:
        - YardPublicAreas
      summary: List yard public areas
      description: >
        Returns the yard public areas within the caller's scope: the entities on which the caller
        holds any role directly, and every entity belonging to a home administrative area on which
        the caller holds any role or which is subordinate to such a unit. Every role is inherited
        downwards along the administrative hierarchy.
      operationId: listYardPublicAreas
      responses:
        "200":
          description: Successfully retrieved the list of yard public areas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YardPublicArea'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - YardPublicAreas
      summary: Create a yard public area
      description: >
        Creates a new yard public area assigned to a home administrative area. Only a caller holding the
        ADMIN role may create yard public areas, and only under a home administrative area within the
        caller's Admin scope: a unit on which the caller holds ADMIN, or one subordinate to such
        a unit. A unit outside that scope is rejected as forbidden.
      operationId: createYardPublicArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YardPublicAreaCreate'
      responses:
        "201":
          description: The yard public area was created.
          headers:
            Location:
              description: URI of the newly created yard public area.
              schema:
                type: string
                example: /api/v1/yard-public-areas/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardPublicArea'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /yard-public-areas/{id}:
    get:
      tags:
        - YardPublicAreas
      summary: Get yard public area by ID
      description: >
        Returns a single yard public area by its unique identifier. The entity must lie within the
        caller's scope: an entity on which the caller holds any role directly, or one belonging
        to a home administrative area on which the caller holds any role or which is subordinate to
        such a unit. An entity outside the caller's scope is reported as not found.
      operationId: getYardPublicAreaById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        "200":
          description: Successfully retrieved the yard public area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardPublicArea'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - YardPublicAreas
      summary: Patch a yard public area
      description: >
        Partially updates a yard public area. Only the supplied fields are changed. Only a caller
        holding the ADMIN role may update yard public areas, and only those within the caller's
        Admin scope; an entity outside that scope is reported as not found. Reassigning the entity
        to a home administrative area outside the caller's Admin scope is rejected as forbidden.
      operationId: patchYardPublicArea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YardPublicAreaUpdate'
      responses:
        "200":
          description: The yard public area was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardPublicArea'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - YardPublicAreas
      summary: Delete a yard public area
      description: >
        Deletes a yard public area by its unique identifier. Only a caller holding the ADMIN role may
        delete yard public areas, and only those within the caller's Admin scope; an entity outside
        that scope is reported as not found.
      operationId: deleteYardPublicArea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        "204":
          description: The yard public area was deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: >
        Returns the users visible to the calling Admin.
        Only the roles inside the caller's scope are included.
      operationId: listUsers
      responses:
        "200":
          description: Successfully retrieved the list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Users
      summary: Create a user
      description: >
        Creates a new user and, optionally, its initial roles. The assignment must lie within
        the calling Admin's scope (403 otherwise). A role whose unit lies outside the calling
        Admin's scope is rejected as a bad request (400).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "201":
          description: The user was created.
          headers:
            Location:
              description: URI of the newly created user.
              schema:
                type: string
                example: /api/v1/users/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: >
        Returns a single user by ID. Only roles within the calling Admin's scope are
        returned.
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        "200":
          description: Successfully retrieved the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Users
      summary: Update a user
      description: >
        Partially updates a user's first name, last name, e-mail address, assignment and/or
        roles.
      operationId: patchUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: The user was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Users
      summary: Deactivate a user
      description: >
        Deactivates a user. The record is not removed. All roles of the user are
        revoked, so every role must lie within the calling Admin's scope
        (403 otherwise). An Admin cannot deactivate their own record.
      operationId: deactivateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: confirmed
          in: query
          required: false
          description: >
            Confirms deactivation of the last active Admin of a unit or public
            entity the user holds the ADMIN role on, after the warning has been
            shown to the user.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The user was deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # ESR building consumption entries of a yard public area
  /yard-public-areas/{id}/esr/buildings:
    get:
      tags:
        - ESR
        - YardPublicAreas
      summary: Fetches the ESR entries for a yard public area
      operationId: getBuildingEsrEntries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        "200":
          description: The list of ESR (building) entries for the yard public area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbstractBuildingConsumption'   # building consumption (plain | heat-only)
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - ESR
        - YardPublicAreas
      summary: Create a new ESR (building) entry for the yard public area
      operationId: createBuildingEsrEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbstractBuildingConsumptionInput'   # building consumption (plain | heat-only)
      responses:
        "200":
          description: The ESR entry was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbstractBuildingConsumption'   # building consumption (plain | heat-only)
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # single building consumption entry
  /yard-public-areas/{yardPublicAreaId}/esr/buildings/{id}:
    put:
      tags:
        - ESR
        - YardPublicAreas
      summary: Replace an ESR (building) entry for the yard public area
      operationId: replaceBuildingEsrEntry
      parameters:
        - name: yardPublicAreaId
          in: path
          required: true
          description: The yard public area the entry belongs to
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: id
          in: path
          required: true
          description: ID of the ESR entry
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbstractBuildingConsumptionInput'   # building consumption (plain | heat-only)
      responses:
        "200":
          description: The ESR entry was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbstractBuildingConsumption'   # building consumption (plain | heat-only)
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - ESR
        - YardPublicAreas
      summary: Delete an ESR (building) entry for the yard public area
      operationId: deleteBuildingEsrEntry
      parameters:
        - name: yardPublicAreaId
          in: path
          required: true
          description: The yard public area the entry belongs to
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: id
          in: path
          required: true
          description: ID of the ESR entry
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        "200":
          description: The ESR entry was deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # categories of the building classification catalogue (BWZK)
  /esr/buildings/categories:
    get:
      tags:
        - ESR
      summary: Fetch all building consumption categories.
      operationId: listBuildingConsumptionCategories
      responses:
        "200":
          description: All building consumption categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuildingConsumptionCategory'   # building consumption category (BWZK)
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # units of energy carriers
  /esr/energy-carriers/units:
    get:
      tags:
        - ESR
      summary: Fetch all energy carrier units.
      operationId: listEnergyCarrierUnits
      responses:
        "200":
          description: All energy carrier units.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnergyCarrierUnit'   # unit of an energy carrier
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'


security:
  - bearerAuth: [ ]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer authentication
  schemas:

    # EnergyCarrier = energy carrier (electricity, heating oil, natural gas ...).
    EnergyCarrier:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          example: "Electricity"

    # EnergyCarrierUnit = unit of an energy carrier (l, m³, kWh ...).
    # Master data: one row per (carrier, unit) with its conversion factor to kWh.
    EnergyCarrierUnit:
      type: object
      required:
        - id
        - carrier
        - name
        - conversionFactor
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        carrier:
          $ref: '#/components/schemas/EnergyCarrier'   # energy carrier
        name:
          type: string
          example: "kWh"
        conversionFactor:   # conversion factor (to kWh)
          $ref: '#/components/schemas/Decimal22_10'   # decimal(22,10) as string

    # BuildingConsumptionCategory = building consumption category.
    # Master data: a BWZK (building classification catalogue) number, e.g. 0200.
    BuildingConsumptionCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          example: "0200"

    # EnergyCarrierConsumption = consumption of an energy carrier.
    # Value object: which unit (and thereby which carrier) + how much (quantity).
    EnergyCarrierConsumption:
      type: object
      required:
        - id
        - unit
        - quantity
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        unit:
          $ref: '#/components/schemas/EnergyCarrierUnit'   # unit of an energy carrier
        quantity:   # consumed quantity
          $ref: '#/components/schemas/Decimal22_10'   # decimal(22,10) as string

    # Building consumption – common base
    BuildingConsumptionBase:
      type: object
      required:
        - id
        - yardPublicArea
        - category
        - consumption
        - start
        - end
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        yardPublicArea:
          $ref: '#/components/schemas/YardPublicAreaReference'
        category:
          $ref: '#/components/schemas/BuildingConsumptionCategory'   # building consumption category (BWZK)
        consumption:
          $ref: '#/components/schemas/EnergyCarrierConsumption'   # consumption of an energy carrier (unit + quantity)
        start:   # start date of consumption
          type: string
          format: date
          example: 1.1.2026
        end:   # end date of consumption
          type: string
          format: date
          example: 1.1.2027

    # AbstractBuildingConsumption = abstract building consumption
    AbstractBuildingConsumption:
      oneOf:
        - $ref: '#/components/schemas/BuildingConsumption'   # building consumption, not heat-only
        - $ref: '#/components/schemas/HeatBuildingConsumption'   # building consumption, heat-only
      discriminator:
        propertyName: objectType
        mapping:
          BuildingConsumption: '#/components/schemas/BuildingConsumption'   # building consumption, not heat-only
          HeatBuildingConsumption: '#/components/schemas/HeatBuildingConsumption'   # building consumption, heat-only

    # BuildingConsumption = building consumption
    # Answer 'No' to 'exclusively for heat generation?' -> no climate-factor question.
    BuildingConsumption:
      type: object
      required:
        - objectType
      properties:
        objectType:   # discriminator: BuildingConsumption | HeatBuildingConsumption
          type: string
          example: "BuildingConsumption"
      allOf:
        - $ref: '#/components/schemas/BuildingConsumptionBase'

    # HeatBuildingConsumption = heat building consumption
    # Answer 'Yes' to 'exclusively for heat generation?' -> has isWeatherAdjusted (weather-adjusted with DWD climate factors?).
    HeatBuildingConsumption:
      type: object
      required:
        - objectType
        - isWeatherAdjusted
      properties:
        objectType:   # discriminator: BuildingConsumption | HeatBuildingConsumption
          type: string
          example: "HeatBuildingConsumption"
        isWeatherAdjusted:   # is weather-adjusted (with DWD climate factors)?
          type: boolean
      allOf:
        - $ref: '#/components/schemas/BuildingConsumptionBase'

    # BuildingConsumptionBaseInput = building consumption base input
    BuildingConsumptionBaseInput:
      type: object
      required:
        - carrier
        - quantity
        - category
        - start
        - end
      properties:
        carrier:   # energy carrier id
          $ref: '#/components/schemas/Uuid'
        quantity:   # consumed quantity
          $ref: '#/components/schemas/Decimal22_10'   # decimal(22,10) as string
        category:   # category id
          $ref: '#/components/schemas/Uuid'
        start:   # start date of consumption
          type: string
          format: date
          example: 1.1.2026
        end:   # end date of consumption
          type: string
          format: date
          example: 1.1.2027

    # Abstract building consumption input
    # oneOf: BuildingConsumptionInput (not heat-only) | HeatBuildingConsumptionInput (heat-only); objectType says which.
    AbstractBuildingConsumptionInput:
      oneOf:
        - $ref: '#/components/schemas/BuildingConsumptionInput'   # not heat-only
        - $ref: '#/components/schemas/HeatBuildingConsumptionInput'   # heat-only
      discriminator:
        propertyName: objectType
        mapping:
          BuildingConsumption: '#/components/schemas/BuildingConsumptionInput'
          HeatBuildingConsumption: '#/components/schemas/HeatBuildingConsumptionInput'

    # Building consumption input, not heat-only.
    BuildingConsumptionInput:
      type: object
      required:
        - objectType
      properties:
        objectType:
          type: string
          example: "BuildingConsumption"
        isWeatherAdjusted:   # is weather-adjusted? (NOTE: belongs to Heat... only)
          type: boolean
      allOf:
        - $ref: '#/components/schemas/BuildingConsumptionBaseInput'

    # Heat building consumption input, heat-only.
    HeatBuildingConsumptionInput:
      type: object
      required:
        - objectType
        - isWeatherAdjusted
      properties:
        objectType:
          type: string
          example: "HeatBuildingConsumption"
        isWeatherAdjusted:   # is weather-adjusted (with DWD climate factors)?
          type: boolean
      allOf:
        - $ref: '#/components/schemas/BuildingConsumptionBaseInput'

    Decimal22_10:
      type: string
      example: "012345678901.0123456789"
      description: A number in the decimal(22, 10) format. I.e. 22 digits overall, 10 of which are after the decimal point.

    ErrorResponse:
      type: object
      description: Standard error response returned by the API.
      required:
        - title
        - status
        - code
      properties:
        title:
          type: string
          description: Short summary of the error.
          example: Validation failed

        additionalInformation:
          type: object
          additionalProperties: { type: object }

        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400

        detail:
          type: string
          description: Detailed explanation of the error.
          example: Postal code is invalid.

        code:
          type: string
          description: Machine-readable application error code.
          example: ADDRESS_001

        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred.
          example: "2026-07-16T14:20:11Z"

        instance:
          type: string
          description: URI identifying the request that caused the error.
          example: /api/v1/yard-public-areas/3fa85f64-5717-4562-b3fc-2c963f66afa6

        traceId:
          type: string
          description: Correlation identifier for troubleshooting.
          example: 9b35d80dcbfd

    HomeAdministrativeArea:
      type: object
      description: Represents a home administrative area in the system.
      required:
        - id
        - name
        - objectType
      properties:
        objectType:
          type: string
          example: "HomeAdministrativeArea"
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          description: Name of the home administrative area.
          example: Berlin
        code:
          type: string
          maxLength: 16
          description: Code of the home administrative area.
          example: "HOME001"
        populationCount:
          type: integer
          description: Population count of the home administrative area.
          example: 3685265
        levelType:
          type: integer
          description: "Hierarchy level of the home administrative area: 1 = top level, each level below increases by one."
          example: 1
        parent:
          $ref: '#/components/schemas/HomeAdministrativeAreaReference'

    YardPublicArea:
      type: object
      description: Represents a yard public area belonging to a home administrative area.
      required:
        - id
        - name
        - homeAdministrativeArea
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Name of the yard public area.
          example: Municipal swimming pool Mitte
        homeAdministrativeArea:
          $ref: '#/components/schemas/HomeAdministrativeAreaReference'

    HomeAdministrativeAreaReference:
      type: object
      description: Reduced representation of a home administrative area, used for parent references.
      required:
        - id
        - name
        - objectType
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        objectType:
          type: string
          example: "HomeAdministrativeArea"
        name:
          type: string
          description: Name of the home administrative area.
          example: Berlin
        code:
          type: string
          maxLength: 16
          description: Code of the home administrative area.
          example: "HOME001"
        levelType:
          type: integer
          description: "Hierarchy level of the home administrative area: 1 = top level, each level below increases by one."
          example: 1

    YardPublicAreaReference:
      type: object
      description: Reduced representation of a yard public area, used for user assignments.
      required:
        - id
        - name
        - objectType
      properties:
        objectType:
          type: string
          example: "yard-public-area"
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          description: Name of the yard public area.
          example: Municipal swimming pool Mitte

    YardPublicAreaCreate:
      type: object
      description: Payload for creating a yard public area.
      required:
        - name
        - homeAdministrativeAreaId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Name of the yard public area.
          example: Municipal swimming pool Mitte
        homeAdministrativeAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the home administrative area the yard public area belongs to.

    YardPublicAreaUpdate:
      type: object
      description: Payload for partially updating a yard public area. At least one field must be supplied.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: New name of the yard public area.
          example: Municipal swimming pool Mitte
        homeAdministrativeAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the home administrative area the yard public area is reassigned to.

    User:
      type: object
      description: A user account
      required:
        - id
        - firstName
        - lastName
        - email
        - active
        - assignment
        - roles
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: First name
          example: Luka
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Last name
          example: Mayr
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: E-mail address
          example: luka.mayr@home.de
        active:
          type: boolean
          description: Whether the user account is active
          example: true
        assignment:
          $ref: '#/components/schemas/AssignmentReference'
        roles:
          type: array
          description: >
            Roles of the user that lie within the calling Admin's scope.
          items:
            $ref: '#/components/schemas/UserRole'

    Role:
      type: string
      description: >
        Role of a user within a scope. The functional roles are register-specific
        (ESR = Energy Supply Register, GIR = Gas Infrastructure Register); ADMIN is cross-register.
      enum:
        - ESR_EDITOR
        - ESR_APPROVER
        - ESR_VIEWER
        - GIR_EDITOR
        - GIR_APPROVER
        - GIR_VIEWER
        - ADMIN
      example: ESR_EDITOR

    UserRole:
      type: object
      description: >
        A role of a user within a scope (home administrative area or yard public area). The role is
        inherited downwards: it applies to the scope itself and to every unit below it.
      required:
        - id
        - role
        - assignment
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/Role'
        assignment:
          $ref: '#/components/schemas/AssignmentReference'

    UserRoleCreate:
      type: object
      description: >
        Payload for assigning a role to a user on a home administrative area or a yard public area.
        The role also applies to everything below that unit in the administrative hierarchy.
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
        homeAdministrativeAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the home administrative area the role applies to.
        yardPublicAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the yard public area the role applies to.
      oneOf:
        - required: [ homeAdministrativeAreaId ]
          not:
            required: [ yardPublicAreaId ]
        - required: [ yardPublicAreaId ]
          not:
            required: [ homeAdministrativeAreaId ]

    AssignmentReference:
      type: object
      description: The organisational unit the user is assigned to.
      oneOf:
        - $ref: '#/components/schemas/HomeAdministrativeAreaReference'
        - $ref: '#/components/schemas/YardPublicAreaReference'
      discriminator:
        propertyName: objectType
        mapping:
          homeAdministrativeAreaReference: '#/components/schemas/HomeAdministrativeAreaReference'
          yardPublicAreaReference: '#/components/schemas/YardPublicAreaReference'

    AssignmentType:
      type: string
      description: Discriminator for the organisational unit a user is assigned to.
      enum:
        - homeAdministrativeAreaReference
        - yardPublicAreaReference

    UserCreate:
      type: object
      description: Payload for creating a user
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Luka
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Mayr
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          example: luka.mayr@home.de
        homeAdministrativeAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the home administrative area the user belongs to.
        yardPublicAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the yard public area the user belongs to.
        roles:
          type: array
          description: Initial roles. Every unit must lie within the calling Admin's scope.
          items:
            $ref: '#/components/schemas/UserRoleCreate'
      oneOf:
        - required: [ homeAdministrativeAreaId ]
          not:
            required: [ yardPublicAreaId ]
        - required: [ yardPublicAreaId ]
          not:
            required: [ homeAdministrativeAreaId ]

    UserUpdate:
      type: object
      description: Payload for partially updating a user. At least one field must be supplied.
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Luka
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Mayr
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          example: luka.mayr@home.de
        homeAdministrativeAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the home administrative area the user is reassigned to.
        yardPublicAreaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the yard public area the user is reassigned to.
        roles:
          type: array
          description: >
            Desired roles within the calling Admin's scope. Three cases:
            (1) property absent or null - the user's roles are left untouched;
            (2) empty array - all of the user's roles within the calling Admin's scope are removed;
            (3) non-empty array - exactly these roles remain within the calling Admin's scope:
            listed roles that do not exist yet are added, existing roles that are not listed are
            removed, matching roles are left unchanged.
          items:
            $ref: '#/components/schemas/UserRoleCreate'
      # At most one of the two: a patch may carry neither, for example when only roles change.
      not:
        required: [ homeAdministrativeAreaId, yardPublicAreaId ]

    Uuid:
      type: string
      format: uuid
      description: Universally unique identifier.
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

